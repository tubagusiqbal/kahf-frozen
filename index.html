<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Kasir POS</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      :root {
        --bg: #f3f5f9;
        --cd: #fff;
        --tx: #0f172a;
        --mu: #64748b;
        --ln: #e4e8f0;
        --pr: #2563eb;
        --ok: #16a34a;
        --bad: #dc2626;
        --sh: 0 2px 14px rgba(0, 0, 0, 0.13);
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0b1120;
          --cd: #151d31;
          --tx: #e8edf7;
          --mu: #8b97ad;
          --ln: #243049;
          --sh: 0 2px 14px rgba(0, 0, 0, 0.6);
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b1120;
        --cd: #151d31;
        --tx: #e8edf7;
        --mu: #8b97ad;
        --ln: #243049;
        --sh: 0 2px 14px rgba(0, 0, 0, 0.6);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font: 15px/1.4 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI",
          Roboto, sans-serif;
      }
      #app {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
      }
      main {
        padding: 18px 16px 100px;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border: 0;
        background: none;
      }
      input,
      select {
        font: inherit;
        color: var(--tx);
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--ln);
        border-radius: 12px;
        background: var(--cd);
        outline: 0;
      }
      input:focus,
      select:focus {
        border-color: var(--pr);
      }
      .hd {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .hd small {
        color: var(--mu);
        font-size: 12px;
      }
      .hd h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: -0.5px;
      }
      .ib {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: var(--cd);
        box-shadow: var(--sh);
        display: grid;
        place-items: center;
        font-size: 22px;
        color: var(--pr);
      }
      .wallet {
        position: relative;
        overflow: hidden;
        border-radius: 22px;
        padding: 20px;
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #1e3a8a);
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.3);
      }
      .wallet:after {
        content: "";
        position: absolute;
        right: -40px;
        top: -40px;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
      }
      .wt {
        font-weight: 700;
        opacity: 0.95;
      }
      .wl {
        font-size: 12px;
        opacity: 0.75;
        margin-top: 18px;
      }
      .wb {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -1px;
        margin: 2px 0 16px;
      }
      .wr {
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        z-index: 1;
      }
      .vr {
        display: flex;
        gap: 6px;
        align-items: center;
        background: rgba(255, 255, 255, 0.18);
        padding: 8px 14px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 13px;
        color: #fff;
      }
      .eye {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.18);
        display: grid;
        place-items: center;
        color: #fff;
      }
      .g3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 14px 0;
      }
      .g2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 14px 0;
      }
      .st {
        background: var(--cd);
        border-radius: 16px;
        padding: 12px;
        box-shadow: var(--sh);
      }
      .st small {
        color: var(--mu);
        font-size: 11px;
        display: block;
      }
      .st b {
        font-size: 15px;
        display: block;
        margin-top: 4px;
        word-break: break-word;
      }
      h2 {
        font-size: 16px;
        margin: 22px 0 10px;
      }
      .card {
        background: var(--cd);
        border-radius: 18px;
        box-shadow: var(--sh);
        padding: 14px;
      }
      .scroll {
        max-height: 290px;
        overflow-y: auto;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .sp {
        flex: 1;
        min-width: 0;
      }
      .li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid var(--ln);
      }
      .li:last-child {
        border: 0;
      }
      .li b {
        display: block;
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .li small {
        color: var(--mu);
        font-size: 12px;
      }
      .th {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: var(--ln);
        object-fit: cover;
        display: grid;
        place-items: center;
        font-size: 20px;
        flex: none;
        overflow: hidden;
      }
      .ia {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--mu);
      }
      .ia.d {
        color: var(--bad);
      }
      .bt {
        width: 100%;
        padding: 14px;
        border-radius: 14px;
        background: var(--pr);
        color: #fff;
        font-weight: 700;
        margin-top: 12px;
      }
      .bt:disabled {
        opacity: 0.45;
      }
      .bt2 {
        width: 100%;
        padding: 13px;
        border-radius: 14px;
        background: var(--bg);
        font-weight: 600;
        margin-top: 8px;
        border: 1px solid var(--ln);
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      .chip {
        padding: 8px 14px;
        border-radius: 99px;
        border: 1px solid var(--ln);
        background: var(--cd);
        font-size: 13px;
      }
      .chip.on {
        background: var(--pr);
        color: #fff;
        border-color: var(--pr);
      }
      .seg {
        display: flex;
        background: var(--bg);
        border-radius: 12px;
        padding: 4px;
        gap: 4px;
        border: 1px solid var(--ln);
      }
      .seg button {
        flex: 1;
        padding: 9px;
        border-radius: 9px;
        font-weight: 600;
        font-size: 13px;
        color: var(--mu);
      }
      .seg .on {
        background: var(--cd);
        color: var(--pr);
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.12);
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--mu);
        margin: 12px 0 5px;
      }
      .qt {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .qt button {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: var(--pr);
        color: #fff;
        display: grid;
        place-items: center;
      }
      .qt button.m {
        background: var(--bg);
        color: var(--tx);
        border: 1px solid var(--ln);
      }
      .qt span {
        min-width: 20px;
        text-align: center;
        font-weight: 700;
      }
      .empty {
        text-align: center;
        padding: 30px 10px;
        color: var(--mu);
      }
      .empty b {
        display: block;
        color: var(--tx);
        font-size: 17px;
        margin-bottom: 6px;
      }
      .steps {
        display: flex;
        gap: 6px;
        margin-bottom: 14px;
      }
      .steps div {
        flex: 1;
        font-size: 11px;
        color: var(--mu);
        border-top: 3px solid var(--ln);
        padding-top: 5px;
      }
      .steps .on {
        border-color: var(--pr);
        color: var(--pr);
        font-weight: 700;
      }
      .tg {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 99px;
        background: #dbeafe;
        color: #1d4ed8;
      }
      .tg.r {
        background: #fee2e2;
        color: #b91c1c;
      }
      nav {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 480px;
        background: var(--cd);
        border-top: 1px solid var(--ln);
        display: flex;
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
        z-index: 5;
      }
      nav button {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        font-size: 11px;
        color: var(--mu);
        padding: 6px 0;
      }
      nav .on {
        color: var(--pr);
        font-weight: 700;
      }
      nav {
        align-items: flex-end;
      }
      nav button {
        font-size: 10px;
      }
      nav .fab {
        flex: none;
        width: 62px;
        height: 62px;
        border-radius: 50%;
        background: var(--pr);
        color: #fff;
        margin: -28px 6px 2px;
        display: grid;
        place-items: center;
        box-shadow: 0 6px 18px rgba(37, 99, 235, 0.5);
        padding: 0;
        border: 4px solid var(--cd);
      }
      nav .fab.on {
        background: #1d4ed8;
        color: #fff;
      }
      .ov {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 20;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .sheet {
        width: 100%;
        max-width: 480px;
        max-height: 94vh;
        overflow: auto;
        background: var(--bg);
        border-radius: 24px 24px 0 0;
        padding: 16px;
        animation: up 0.3s;
      }
      .dlg {
        background: var(--cd);
        width: calc(100% - 40px);
        max-width: 340px;
        border-radius: 20px;
        padding: 18px;
        margin: auto;
      }
      .dlg h3 {
        margin: 0 0 10px;
      }
      .dlg .row button {
        padding: 12px;
        border-radius: 12px;
        font-weight: 600;
        flex: 1;
      }
      .paper {
        background: #fff;
        color: #111;
        padding: 18px 16px 22px;
        font: 13px/1.5 ui-monospace, Menlo, monospace;
        transform-origin: top;
        animation: pr 0.8s ease-out;
        clip-path: polygon(
          0 0,
          100% 0,
          100% calc(100% - 8px),
          96% 100%,
          92% calc(100% - 8px),
          88% 100%,
          84% calc(100% - 8px),
          80% 100%,
          76% calc(100% - 8px),
          72% 100%,
          68% calc(100% - 8px),
          64% 100%,
          60% calc(100% - 8px),
          56% 100%,
          52% calc(100% - 8px),
          48% 100%,
          44% calc(100% - 8px),
          40% 100%,
          36% calc(100% - 8px),
          32% 100%,
          28% calc(100% - 8px),
          24% 100%,
          20% calc(100% - 8px),
          16% 100%,
          12% calc(100% - 8px),
          8% 100%,
          4% calc(100% - 8px),
          0 100%
        );
      }
      .paper hr {
        border: 0;
        border-top: 1px dashed #999;
        margin: 8px 0;
      }
      .paper .rw {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .paper .c {
        text-align: center;
      }
      .paper .qt button {
        width: 22px;
        height: 22px;
        border-radius: 6px;
      }
      .ok {
        color: var(--ok);
        font-weight: 700;
        text-align: center;
        margin: 10px 0;
      }
      @keyframes pr {
        from {
          transform: scaleY(0.05);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      @keyframes up {
        from {
          transform: translateY(40px);
          opacity: 0;
        }
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 90px;
        transform: translateX(-50%);
        background: #0f172a;
        color: #fff;
        padding: 10px 16px;
        border-radius: 12px;
        z-index: 30;
        font-size: 13px;
      }
      .fl {
        position: relative;
      }
      .fl select {
        position: absolute;
        inset: 0;
        opacity: 0;
      }
      @media print {
        body > *:not(#modal) {
          display: none !important;
        }
        .ov {
          position: static;
          background: none;
        }
        .acts {
          display: none;
        }
        .sheet {
          background: #fff;
          padding: 0;
        }
      }
    .rk{position:absolute;top:-6px;left:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--pr);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--cd)}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);border-radius:99px}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--cd);border:1px solid var(--ln);border-radius:12px;box-shadow:var(--sh);z-index:6;overflow:hidden}.sug:empty{display:none}
.sug button{display:flex;width:100%;justify-content:space-between;gap:8px;padding:11px 12px;text-align:left;border-bottom:1px solid var(--ln)}.sug button:last-child{border:0}.sug small{color:var(--mu)}
.stk{position:sticky;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:4;box-shadow:0 6px 18px rgba(37,99,235,.35)}
.cbw{position:sticky;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;align-items:center;gap:12px;padding:10px 12px;margin-top:12px;background:var(--cd);border:1px solid var(--ln);border-radius:18px;box-shadow:0 6px 18px rgba(37,99,235,.25)}
.cbw[hidden]{display:none}
.cbp{display:flex;align-items:center;gap:10px;flex:1 1 0;min-width:0;max-width:270px;overflow-x:auto;overflow-y:hidden;padding:9px 8px 2px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cbp::-webkit-scrollbar{display:none}
.cbi{position:relative;box-sizing:border-box;width:44px;height:44px;min-width:44px;min-height:44px;flex:none;aspect-ratio:1/1;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:20px}
.cbi img{width:44px;height:44px;border-radius:50%;object-fit:cover;display:block}
.cbi b{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--pr);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:1.5px solid var(--cd);line-height:1;box-sizing:border-box}
.cbw .bt{margin-top:0;flex:none;width:auto;max-width:135px;padding:11px 14px;line-height:1.2;font-size:14px}
.cbp>.cbi:first-child{margin-left:auto}
.cbi{cursor:pointer;-webkit-tap-highlight-color:transparent}
.cbt{position:absolute;bottom:calc(100% + 10px);z-index:6;max-width:calc(100% - 16px);width:max-content;padding:8px 12px;border-radius:16px 16px 16px 4px;background:var(--pr);color:#fff;font-size:13px;font-weight:600;line-height:1.3;box-shadow:0 4px 14px rgba(0,0,0,.2);transform:translateX(-50%);animation:cbtin .18s ease-out;word-break:break-word}
.cbt[hidden]{display:none}
.cbt::after{content:"";position:absolute;top:100%;left:var(--tl,50%);margin-left:-6px;border:6px solid transparent;border-top-color:var(--pr);border-bottom:0}
@keyframes cbtin{from{opacity:0;transform:translateX(-50%) translateY(6px) scale(.9)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.stkv{flex:1;text-align:center;font-size:20px;font-weight:800;padding:10px;border:1px solid var(--ln);border-radius:12px;background:var(--bg)}
.stkrow{display:flex;gap:8px;align-items:center}.stkrow input{text-align:center;flex:1}.stkrow .ia{width:44px;height:44px;flex:none;font-size:20px;font-weight:700}
</style>
  </head>
  <body>
    <div id="app">
      <main id="main"></main>
      <nav></nav>
    </div>
    <div id="modal"></div>
    <div id="dlg"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
      const I = {
        home: "fa-solid fa-house",
        box: "fa-solid fa-box",
        cart: "fa-solid fa-bag-shopping",
        chart: "fa-solid fa-chart-simple",
        gear: "fa-solid fa-sliders",
        plus: "fa-solid fa-plus",
        edit: "fa-solid fa-pen",
        trash: "fa-solid fa-trash",
        eye: "fa-solid fa-eye",
        eyeoff: "fa-solid fa-eye-slash",
        arrow: "fa-solid fa-arrow-right",
        filter: "fa-solid fa-filter",
        minus: "fa-solid fa-minus",
        print: "fa-solid fa-print",
        wa: "fa-brands fa-whatsapp",
        search: "fa-solid fa-magnifying-glass",
        back: "fa-solid fa-arrow-left",
      };

      const ic = (n, s = 20) =>
        `<i class="${I[n] || ""}" style="font-size:${s}px"></i>`;
      const $ = (s) => document.querySelector(s),
        esc = (s) =>
          String(s ?? "").replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])
          );
      const rp = (n) => "Rp" + Math.round(n || 0).toLocaleString("id-ID"),
        sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
      const fdt = (t) =>
        new Date(t).toLocaleString("id-ID", {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      const K = "pos_v1",
        def = () => ({
          cats: ["Pempek", "Bento"],
          prods: [],
          orders: [],
          seq: 0,
          hide: false,
          set: {
            name: "Nama Toko",
            icon: "🏪",
            qris: "",
            bank: "",
            rek: "",
            an: "",
          },
        });
      let S;
      try {
        S = JSON.parse(localStorage.getItem(K)) || def();
      } catch (e) {
        S = def();
      }
      const save = () => {
        S.mt = Date.now();
        try {
          localStorage.setItem(K, JSON.stringify(S));
        } catch (e) {
          toast("Penyimpanan penuh, gunakan foto lebih kecil");
        }
        cloudPush();
      };
      const fix = () => {
        S.rs = S.rs || { min: 5, cat: "" };
        S.rules = S.rules || [{ cat: S.rs.cat, min: S.rs.min }];
        S.set.banks =
          S.set.banks ||
          (S.set.rek
            ? [{ bank: S.set.bank, rek: S.set.rek, an: S.set.an }]
            : []);
      };
      fix();
      const applyTheme = () => {
        const t = S.theme;
        if (t == "light" || t == "dark")
          document.documentElement.dataset.theme = t;
        else delete document.documentElement.dataset.theme;
      };
      applyTheme();
      const newD = () => ({
        step: 1,
        cart: {},
        cust: "",
        type: "Umum",
        wa: "",
        method: "Cash",
        cash: "",
        ongkir: 0,
      });
      let V = "dash",
        PF = { q: "", f: "az" },
        P = null,
        D = newD(),
        OF = { q: "", c: "" },
        RG = 7,
        R = null,
        ASK = null;
      const NAV = [
        ["dash", "Dashboard", "home"],
        ["prod", "Products", "box"],
        ["order", "", "cart"],
        ["sales", "Sales", "chart"],
        ["set", "Settings", "gear"],
      ];
      $("nav").innerHTML = NAV.map(
        (n) =>
          `<button data-v="${n[0]}" class="${n[1] ? "" : "fab"}" aria-label="${
            n[0]
          }" onclick="go('${n[0]}')">${ic(n[2], n[1] ? 22 : 30)}${
            n[1]
          }</button>`
      ).join("");
      const go = (v) => {
        V = v;
        render();
        scrollTo(0, 0);
      };
      function toast(t) {
        const e = document.createElement("div");
        e.className = "toast";
        e.textContent = t;
        document.body.appendChild(e);
        setTimeout(() => e.remove(), 2000);
      }
      function render() {
        $("#main").innerHTML = {
          dash: vDash,
          prod: vProd,
          newp: vNewp,
          order: vOrder,
          sales: vSales,
          set: vSet,
        }[V]();
        document
          .querySelectorAll("nav button")
          .forEach((b) =>
            b.classList.toggle("on", b.dataset.v == (V == "newp" ? "prod" : V))
          );
        $("nav").style.display = V == "newp" ? "none" : "flex";
      }
      const head = (s, t, r = "") =>
        `<div class=hd><div><small>${s}</small><h1>${t}</h1></div>${r}</div>`;
      function ask(t, val, cb, conf) {

      function rTxt() {
  const o = R.o, s = S.set, L = "━━━━━━━━━━━━━━";
  let n = String(o.wa || "").replace(/\D/g, "");

  t += o.items.map((i) => `${i.name}\n    ${i.qty} x ${rp(i.price)} = *${rp(i.qty * i.price)}*`).join("\n");
  if ((+o.ongkir || 0) > 0) t += `\n${L}\nOngkir: *${rp(o.ongkir)}*`;
  t += `\n${L}\n *TOTAL: ${rp(o.total)}*\n${R.mode == "po" ? "Status: Pre Order (belum dibayar)" : "Metode: " + o.method}`;
  if (o.method == "Cash") t += `\nTunai: ${rp(o.cash)}\nKembali: ${rp(o.change)}`;
  if (pay && s.banks.length) t += `\n${L}\n *TRANSFER KE*\n` + s.banks.map((b) => `${b.bank}\n${b.rek}\na.n. ${b.an}`).join("\n\n");
  t += `\n${L}\nTerima kasih`;
  return { n, t };
}

        if (ex && ex.wa && !D.wa) { D.wa = ex.wa; const w = $("#cw"); if (w) w.value = ex.wa; }
        SG = q ? all.filter((c) => c.name.toLowerCase().includes(q)).sort((a, b) => (b.name.toLowerCase().startsWith(q) ? 1 : 0) - (a.name.toLowerCase().startsWith(q) ? 1 : 0) || b.n - a.n).slice(0, 6) : [];
        box.innerHTML = SG.map((c, i) => "<button onclick=\"pickCust(" + i + ")\"><b>" + esc(c.name) + "</b><small>" + esc(c.wa || "") + "</small></button>").join("");
      }
      function pickCust(i) { const c = SG[i]; if (!c) return; D.cust = c.name; if (c.wa) D.wa = c.wa; render(); }
      /* ---------- GOOGLE SHEET SYNC ---------- */
      let CFG = { url: "", key: "" };
      try { CFG = JSON.parse(localStorage.getItem("pos_cfg")) || CFG; } catch (e) {}
      const SYNC = { ts: +localStorage.getItem("pos_ts") || 0, t: null, busy: false, dirty: false, msg: CFG.url ? "Terhubung" : "Belum terhubung" };
      const setSt = (m) => { SYNC.msg = m; const e = $("#syncst"); if (e) e.textContent = m; };
      async function api(act, body = {}) {
        const r = await fetch(CFG.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ act, key: CFG.key, ...body }) });
        const j = await r.json();
        if (j.error) throw new Error(j.error);
        return j;
      }
      function cloudPush() {
        if (!CFG.url) return;
        SYNC.dirty = true;
        clearTimeout(SYNC.t);
        SYNC.t = setTimeout(doPush, 1200);
        setSt("Menyimpan…");
      }
      async function doPush() {
        if (SYNC.busy) { SYNC.t = setTimeout(doPush, 800); return; }
        SYNC.busy = true; SYNC.dirty = false;
        try {
          const r = await api("push", { base: SYNC.ts, ts: S.mt, data: JSON.stringify(S) });
          if (r.conflict) { SYNC.busy = false; toast("Data diubah perangkat lain, memuat ulang…"); return cloudPull(); }
          SYNC.ts = r.ts; localStorage.setItem("pos_ts", r.ts);
          setSt("Tersinkron ✓ " + new Date().toLocaleTimeString("id-ID"));
        } catch (e) {
          setSt("Gagal sinkron, dicoba lagi otomatis");
          SYNC.t = setTimeout(doPush, 10000);
        }
        SYNC.busy = false;
        if (SYNC.dirty) cloudPush();
      }
      async function cloudPull() {
        if (!CFG.url) return;
        setSt("Memuat data…");
        try {
          const r = await api("pull");
          if (r.empty) { SYNC.ts = 0; cloudPush(); }
          else if (r.ts > SYNC.ts) {
            S = { ...def(), ...JSON.parse(r.data) }; fix(); applyTheme();
            SYNC.ts = r.ts; localStorage.setItem("pos_ts", r.ts);
            try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) {}
            setSt("Tersinkron ✓ " + new Date().toLocaleTimeString("id-ID"));
            render();
          } else { setSt("Tersinkron ✓ " + new Date().toLocaleTimeString("id-ID")); if (S.mt > r.ts) cloudPush(); }
        } catch (e) { setSt("Tidak bisa terhubung: " + e.message); }
      }
      async function cloudConnect() {
        const u = $("#cu").value.trim(), k = $("#ck").value.trim();
        if (!/^https:\/\/script\.google\.com\//.test(u)) return toast("URL Web App tidak valid");
        if (!k) return toast("Isi kode rahasia");
        CFG = { url: u, key: k }; SYNC.ts = 0;
        localStorage.setItem("pos_cfg", JSON.stringify(CFG)); localStorage.removeItem("pos_ts");
        await cloudPull(); render();
      }
      const cloudOff = () => { CFG = { url: "", key: "" }; localStorage.removeItem("pos_cfg"); SYNC.msg = "Belum terhubung"; render(); };
      document.addEventListener("visibilitychange", () => { if (!document.hidden && CFG.url && !SYNC.dirty && !SYNC.busy) cloudPull(); });
      if (CFG.url) cloudPull();
      render();
    </script>
  </body>
</html>
